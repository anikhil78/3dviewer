# sim_controllers.yaml
# Controller configuration for Gazebo simulation.
# Mirrors arctos_moveit_config/config/ros2_controllers.yaml but strips out
# all arctos_hardware_interface motor/CAN parameters (not needed in sim).

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — higher than real hardware since sim is not rate-limited by CAN

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arctos_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arctos_hand_controller:
      type: position_controllers/GripperActionController

arctos_arm_controller:
  ros__parameters:
    joints:
      - X_joint
      - Y_joint
      - Z_joint
      - A_joint
      - B_joint
      - C_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    state_tolerance_check: false
    # open_loop_control: the controller uses its own internal trajectory state
    # as the reference for the next setpoint rather than reading back actual
    # joint positions.  This prevents the feedback path from amplifying
    # physics-simulation noise or timing jitter between the 100 Hz controller
    # update and the 1 kHz DART physics step, which otherwise causes ringing
    # or divergence during fast MoveIt trajectories.
    open_loop_control: true

arctos_hand_controller:
  ros__parameters:
    joint: Left_jaw_joint
    action_monitor_rate: 20.0
    allow_stalling: false
