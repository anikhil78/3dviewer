# sim_controllers.yaml
# Controller configuration for Gazebo simulation.
# Mirrors arctos_moveit_config/config/ros2_controllers.yaml but strips out
# all arctos_hardware_interface motor/CAN parameters (not needed in sim).

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — higher than real hardware since sim is not rate-limited by CAN

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arctos_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arctos_hand_controller:
      type: position_controllers/GripperActionController

arctos_arm_controller:
  ros__parameters:
    joints:
      - X_joint
      - Y_joint
      - Z_joint
      - A_joint
      - B_joint
      - C_joint
    # effort interface: the JTC computes torque = Kp*(q_des-q) + Kd*(dq_des-dq)
    # and sends it to GazeboSimSystem which passes it directly to DART as
    # JointForceCmd.  This is the only reliable approach for gz_ros2_control
    # in Harmonic — position interface uses JointPositionReset which creates
    # large constraint impulses whenever DART has accumulated joint velocity.
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    state_tolerance_check: false
    # PID gains — tuned for a desktop serial arm (~0.5–2 kg links, ~0.4 m reach).
    # Scale p up if the arm droops under gravity; scale d up if it oscillates.
    # Keep i=0: integral windup is destabilising with DART's stiff contact model.
    # i_clamp bounds the integral term if you ever need i > 0.
    gains:
      X_joint: {p: 500,  i: 0.0, d: 50,  i_clamp: 100.0}
      Y_joint: {p: 1000, i: 0.0, d: 100, i_clamp: 200.0}
      Z_joint: {p: 600,  i: 0.0, d: 60,  i_clamp: 150.0}
      A_joint: {p: 200,  i: 0.0, d: 20,  i_clamp: 50.0}
      B_joint: {p: 200,  i: 0.0, d: 20,  i_clamp: 50.0}
      C_joint: {p: 100,  i: 0.0, d: 10,  i_clamp: 20.0}

arctos_hand_controller:
  ros__parameters:
    joint: Left_jaw_joint
    action_monitor_rate: 20.0
    allow_stalling: false
