arctos_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # 0.05 s (50 ms) — the 5 ms default is too tight for OMPL's repeated IK calls
  # during tree expansion and causes unnecessary planning failures on complex poses.
  kinematics_solver_timeout: 0.05
